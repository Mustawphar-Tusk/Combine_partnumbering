[project]
name = "pump-configurator"
version = "0.1.0"
description = "Metadata-driven Dean and Fybroc pump configuration, part numbering, pricing, BOM, and quoting platform"
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "sqlalchemy==2.0.51",
    "pyodbc==5.3.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "orjson==3.11.9",
    "python-dotenv==1.2.2",
    "openpyxl==3.1.5",
    "pandas==3.0.3",
    "lxml==6.1.1",
    "oletools==0.60.2",
    "pywin32==312; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "black==26.5.1",
    "isort==8.0.1",
    "mypy==2.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
